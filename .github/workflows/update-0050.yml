name: Update 0050 Data

on:

  workflow_dispatch:

  schedule:
    # 台灣時間平日 15:00
    # UTC 07:00
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          pip install requests

      - name: Update 0050
        run: |
          python scripts/update_0050.py

      - name: Commit data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/0050.json

          git diff --cached --quiet || \
            git commit -m "Update 0050 data"

          git push