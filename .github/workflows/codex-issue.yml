name: Codex Issue Fix

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  codex-fix:
    if: github.event.label.name == 'codex'
    runs-on: ubuntu-latest

    concurrency:
      group: codex-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"

      - name: Prepare working branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="codex/issue-${ISSUE_NUMBER}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git rebase "origin/${{ github.event.repository.default_branch }}"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Resolve GitHub issue #${{ github.event.issue.number }} in this repository.

            Issue title:
            ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Requirements:
            - Read and follow AGENTS.md.
            - Investigate the root cause before editing.
            - Make the smallest reasonable change that fully resolves the issue.
            - Add or update tests when the repository has a suitable test structure.
            - Run relevant validation for all changed files.
            - Do not modify unrelated files.
            - Do not commit, push, merge, or create a pull request yourself.
            - Leave the repository in a ready-to-commit state.

      - name: Detect changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git add -A
          git commit -m "fix: resolve issue #${ISSUE_NUMBER}"
          git push --force-with-lease origin "$BRANCH"

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          EXISTING_PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" \
              --title "Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
              --body "Automated fix generated by Codex.\n\nCloses #${ISSUE_NUMBER}\n\nPlease review the implementation and CI results before merging."
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
              --body "Automated fix generated by Codex.\n\nCloses #${ISSUE_NUMBER}\n\nPlease review the implementation and CI results before merging."
          fi

      - name: Comment when no changes are produced
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "Codex analyzed this issue but did not produce repository changes. Please review the issue details or the workflow logs."
